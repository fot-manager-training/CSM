services:
  - type: web
    name: dtaas-kv-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/kv/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: KV_KNOWLEDGE_PATH
        value: public/assets/kv/knowledge.json
      - key: KV_ALLOWED_ORIGINS
        value: https://fot-manager-training.github.io
